<!DOCTYPE html>
<html>
<head>
  <title>WebP Image Converter</title>
  <style>
    textarea { width: 100%; height: 80px; font-family: monospace; font-size: 11px; }
    .box { margin-bottom: 12px; }
  </style>
</head>
<body>
  <h2>WebP Converter</h2>
  <button id="start" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Convert All Images to WebP</button>
  <pre id="log"></pre>

  <div id="outputs"></div>

  <script>
    const images = [
      { id: 'kitsada', path: './image/hero/kitsada.png', maxW: 630, q: 0.8 },
      { id: 'shadow1', path: './image/hero/background-shadow-1.png', maxW: 1000, q: 0.75 },
      { id: 'shadow2', path: './image/hero/background-shadow-2.png', maxW: 1000, q: 0.75 },
      { id: 'ieecon2026', path: './image/projects/ieecon2026.png', maxW: 800, q: 0.8 },
      { id: 'bottlerefund', path: './image/projects/bottlerefund.png', maxW: 800, q: 0.8 },
      { id: 'nongbualamphu', path: './image/projects/nongbualamphu-travel.png', maxW: 800, q: 0.8 },
      { id: 'mangagood', path: './image/projects/manga-good.png', maxW: 800, q: 0.8 },
      { id: 'digitalreading', path: './image/projects/digital-reading-platform.png', maxW: 800, q: 0.8 },
      { id: 'ticketflix', path: './image/projects/ticket-flix.png', maxW: 800, q: 0.8 },
      { id: 'knowledgeconnect', path: './image/projects/knowledge-connect.png', maxW: 800, q: 0.8 },
      { id: 'bilibiliclon', path: './image/projects/bilibili-clon.png', maxW: 800, q: 0.8 }
    ];

    const container = document.getElementById('outputs');
    images.forEach(img => {
      const div = document.createElement('div');
      div.className = 'box';
      div.innerHTML = `<strong>${img.id} (${img.path}):</strong><br><textarea id="txt_${img.id}"></textarea>`;
      container.appendChild(div);
    });

    document.getElementById('start').onclick = async () => {
      const log = document.getElementById('log');
      log.textContent = 'Starting conversion...\n';

      for (const item of images) {
        log.textContent += `Loading ${item.id}... `;
        try {
          const img = new Image();
          img.src = item.path;
          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = () => reject(new Error(`Failed to load ${item.path}`));
          });

          const canvas = document.createElement('canvas');
          let w = img.width;
          let h = img.height;
          if (w > item.maxW) {
            h = Math.round((h * item.maxW) / w);
            w = item.maxW;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          const webpData = canvas.toDataURL('image/webp', item.q);
          document.getElementById(`txt_${item.id}`).value = webpData;
          log.textContent += `Done (${w}x${h}, ${Math.round(webpData.length / 1024)} KB)\n`;
        } catch (err) {
          log.textContent += `ERROR: ${err.message}\n`;
        }
      }

      log.textContent += '\nConversion Complete!';
    };
  </script>
</body>
</html>
