<!DOCTYPE html>
<html>
<head>
  <title>Image Converter</title>
</head>
<body>
  <h2>WebP Converter</h2>
  <button id="start">Convert All Images to WebP</button>
  <pre id="log"></pre>
  <textarea id="output" style="width:100%; height:400px;"></textarea>

  <script>
    const images = [
      { name: 'kitsada', path: '/image/hero/kitsada.png', maxW: 600, q: 0.8 },
      { name: 'shadow1', path: '/image/hero/background-shadow-1.png', maxW: 800, q: 0.7 },
      { name: 'shadow2', path: '/image/hero/background-shadow-2.png', maxW: 800, q: 0.7 },
      { name: 'ieecon2026', path: '/image/projects/ieecon2026.png', maxW: 800, q: 0.8 },
      { name: 'bottlerefund', path: '/image/projects/bottlerefund.png', maxW: 800, q: 0.8 },
      { name: 'nongbualamphuTravel', path: '/image/projects/nongbualamphu-travel.png', maxW: 800, q: 0.8 },
      { name: 'mangaGood', path: '/image/projects/manga-good.png', maxW: 800, q: 0.8 },
      { name: 'digitalReadingPlatform', path: '/image/projects/digital-reading-platform.png', maxW: 800, q: 0.8 },
      { name: 'ticketFlix', path: '/image/projects/ticket-flix.png', maxW: 800, q: 0.8 },
      { name: 'knowledgeConnect', path: '/image/projects/knowledge-connect.png', maxW: 800, q: 0.8 },
      { name: 'bilibiliClon', path: '/image/projects/bilibili-clon.png', maxW: 800, q: 0.8 }
    ];

    document.getElementById('start').onclick = async () => {
      const log = document.getElementById('log');
      const output = document.getElementById('output');
      log.textContent = 'Starting conversion...\n';
      const results = {};

      for (const item of images) {
        log.textContent += `Loading ${item.name}... `;
        const img = new Image();
        img.src = item.path;
        await new Promise(r => img.onload = r);

        const canvas = document.createElement('canvas');
        let w = img.width;
        let h = img.height;
        if (w > item.maxW) {
          h = Math.round((h * item.maxW) / w);
          w = item.maxW;
        }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        const webpData = canvas.toDataURL('image/webp', item.q);
        results[item.name] = webpData;
        log.textContent += `Done (${Math.round(webpData.length / 1024)} KB)\n`;
      }

      let tsCode = `export const optimizedImages: Record<string, string> = {\n`;
      for (const [key, val] of Object.entries(results)) {
        tsCode += `  ${key}: ${JSON.stringify(val)},\n`;
      }
      tsCode += `};\n`;

      output.value = tsCode;
      log.textContent += '\nConversion Complete!';
    };
  </script>
</body>
</html>
